name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nova-rs

      - name: Build (release)
        working-directory: nova-rs
        run: cargo build --release

      - name: Unit + integration tests
        working-directory: nova-rs
        run: cargo test

      - name: Run example programs with the Rust binary
        run: |
          for f in examples/*.nv; do
            echo "=== $f ==="
            ./nova-rs/target/release/nova "$f"
          done

      - name: Run Rust-only examples (struct / import)
        run: |
          for f in examples/rust-only/*.nv; do
            echo "=== $f ==="
            ./nova-rs/target/release/nova "$f"
          done

      - name: Run self-host programs
        working-directory: selfhost
        run: |
          for f in *.nv; do
            echo "=== $f ==="
            ../nova-rs/target/release/nova "$f"
          done

  python:
    name: Python bootstrap interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run example programs with the Python interpreter
        run: |
          for f in examples/*.nv; do
            echo "=== $f ==="
            python3 interpreter/nova.py "$f"
          done
